[project]
name = "ska-src-site-capabilities-api"
version = "0.3.102"
description = "SRCNet Site Capabilities API"
authors = [
    { name = "Rob Barnsley" },
    { name = "Michele Delli Veneri" },
]
license = "BSD-3-Clause"
requires-python = ">=3.13,<4.0"
dependencies = [
    "Authlib>=1.3.0,<2.0.0",
    "fastapi>=0.124.0,<0.125.0",
    "fastapi-versionizer>=4.0.0,<5.0.0",
    "httpx>=0.28.0,<0.29.0",
    "itsdangerous>=2.2.0,<3.0.0",
    "Jinja2>=3.1.0,<4.0.0",
    "jsonref>=1.1.0,<2.0.0",
    "jsonschema>=4.23.0,<5.0.0",
    "plantuml>=0.3.0,<0.4.0",
    "Markdown>=3.7.0,<4.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pymongo>=4.3.3,<5.0.0",
    "Pygments>=2.18.0,<3.0.0",
    "PyJWT>=2.10.0,<3.0.0",
    "python-dateutil>=2.8.2,<3.0.0",
    "attrs>=24.3.0,<25.0.0",
    "python-multipart>=0.0.6,<0.0.7",
    "requests>=2.32.3,<3.0.0",
    "uvicorn[standard]>=0.34.0,<0.35.0",
    "ska-src-permissions-api==0.2.27",
    "ska-src-auth-api==0.6.15",
    "ska-src-logging==0.6.1+dev.c9cdeaea1",
    "ska-src-api-common==0.1.1",
]

[project.optional-dependencies]
integration = [
    "fire>=0.7.0,<0.8.0",
    "selenium>=4.15.0,<5.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
    "mypy>=1.14.0,<2.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "pytest>=8.3.0,<9.0.0",
    "coverage>=7.6.0,<8.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "pytest-json-report>=1.5.0,<2.0.0",
    "pytest-forked>=1.6.0,<2.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "pytest-repeat>=0.9.0,<0.10.0",
    "pytest-anyio>=0.0.0,<0.0.1",
    "mongomock==4.3.0",
    "pytest-order==1.3.0",
]

docs = [
    "Sphinx>=6.1.0,<7.0.0",
    "docutils>=0.18,<0.19",
    "ska-ser-sphinx-theme>=0.1.1,<0.2.0",
    "sphinx-autodoc-typehints>=1.19,<2.0.0",
    "myst-parser==2.0.0",
    "sphinx-rtd-theme==1.3.0",
    "sphinx-autoapi==3.0.0",
    "sphinxcontrib-mermaid==0.9.2",
    "sphinxcontrib-plantuml==0.28",
    "toml==0.10.2",
    "astroid>=3.0.0,<4.0.0",  # sphinx-autoapi 3.0.0 cannot parse with astroid 4
]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "ska-nexus"
url = "https://artefact.skao.int/repository/pypi-internal/simple"

[[tool.uv.index]]
name = "PyPI-public"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "logging_api"
url = "https://gitlab.com/api/v4/projects/77541150/packages/pypi/simple"
explicit = true

[tool.uv.sources]
ska-src-permissions-api = { index = "ska-nexus" }
ska-src-auth-api = { index = "ska-nexus" }
ska-src-logging = { index = "logging_api" }
ska-src-api-common = { index = "ska-nexus" }

[tool.uv.build-backend]
module-name = "ska_src_site_capabilities_api"
module-root = "src"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
# isort (I), flake8 (E, F, W) and pylint (PL) equivalents
select = ["E", "F", "W", "I", "PL"]
ignore = [
    "PLR0913",  # too-many-arguments, disabled under pylint
    "PLR0917",  # too-many-positional-arguments, disabled under pylint
    "PLR2004",  # magic-value-comparison, pylint extension never enabled
    "PLW2901",  # redefined-loop-name, pylint extension never enabled
]

[tool.ruff.lint.pylint]
# limits carried over from .pylintrc
max-branches = 20
max-returns = 15
max-statements = 70

[build-system]
requires = ["uv_build>=0.9.0,<1.0.0"]
build-backend = "uv_build"
