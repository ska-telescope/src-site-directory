services:
    - docker:dind

variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_DEPTH: 50

cache:
    paths:
        - build

stages:
    - lint
    - lint-post
    - build
    - test
    - publish
    - pages
    - scan
    - integration   # last: the blocking manual job must not hold up any other stage

# Standardised SKAO jobs (see https://gitlab.com/ska-telescope/templates-repository/-/blob/master/gitlab-ci/includes/)
include:
    # python formatting, linting and testing
    - project: "ska-telescope/templates-repository"
      file: "gitlab-ci/includes/python-uv.gitlab-ci.yml"
    # docs
    - project: "ska-telescope/templates-repository"
      file: "gitlab-ci/includes/docs.gitlab-ci.yml"
    # OCI images build and publish
    - project: "ska-telescope/templates-repository"
      file: "gitlab-ci/includes/oci-image.gitlab-ci.yml"
    # k8s
    - project: 'ska-telescope/templates-repository'
      file: 'gitlab-ci/includes/k8s.gitlab-ci.yml'
    # helm chart linting and publishing
    - project: "ska-telescope/templates-repository"
      file: "gitlab-ci/includes/helm-chart.gitlab-ci.yml"
    # badges
    - project: "ska-telescope/templates-repository"
      file: "gitlab-ci/includes/finaliser.gitlab-ci.yml"
    # release automation
    - project: "ska-telescope/templates-repository"
      file: "gitlab-ci/includes/release.gitlab-ci.yml"
    # deployment stack integration tests
    - project: "ska-telescope/src/src-api/ska-src-api-deployment-stack"
      ref: main
      file: ".gitlab/ci/integration.yml"
    - project: 'ska-telescope/templates-repository'
      file: 'gitlab-ci/includes/sonar-scan.gitlab-ci.yml'


# Overrides for SKAO jobs
# Server and client are released independently:
#   <X.Y.Z>         server release: images, helm chart, server package
#   client-<X.Y.Z>  client release: client package only
# The template publish jobs fire on any tag, so each is restricted to its own tag scheme.

python-uv-lock-check:
  stage: lint
  image: $SKA_K8S_TOOLS_BUILD_DEPLOY
  tags:
    - ${SKA_DEFAULT_RUNNER}
  script:
    - make lock-check

# Dev builds (never on tags): build and publish both variants on every pipeline.
python-uv-build-for-development:
  parallel:
    matrix:
      - PYPROJECT_VARIANT: [server, client]

python-uv-build-for-publication:
  variables:
    PYPROJECT_VARIANT: server
  rules:
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+/'
      exists:
        - pyproject.toml

python-uv-build-for-publication-client:
  extends: python-uv-build-for-publication
  variables:
    PYPROJECT_VARIANT: client
  rules:
    - if: '$CI_COMMIT_TAG =~ /^client-[0-9]+\.[0-9]+\.[0-9]+/'
      exists:
        - pyproject.client.toml

python-uv-publish-to-car:
  needs:
    - python-uv-build-for-publication
  rules:
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+/'
      exists:
        - pyproject.toml

python-uv-publish-to-car-client:
  extends: python-uv-publish-to-car
  needs:
    - python-uv-build-for-publication-client
  rules:
    - if: '$CI_COMMIT_TAG =~ /^client-[0-9]+\.[0-9]+\.[0-9]+/'
      exists:
        - pyproject.client.toml

python-uv-publish-to-gitlab:
  variables:
    PYPROJECT_VARIANT: server
  rules:
    - if: '$CI_COMMIT_TAG =~ /^client-/'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+/'
      exists:
        - pyproject.toml
      needs:
        - python-uv-build-for-publication
    - if: '$CI_COMMIT_TAG == null'
      exists:
        - pyproject.toml
      needs:
        - job: 'python-uv-build-for-development: [server]'
    - when: never

python-uv-publish-to-gitlab-client:
  extends: python-uv-publish-to-gitlab
  variables:
    PYPROJECT_VARIANT: client
  rules:
    - if: '$CI_COMMIT_TAG =~ /^[0-9]/'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^client-[0-9]+\.[0-9]+\.[0-9]+/'
      exists:
        - pyproject.client.toml
      needs:
        - python-uv-build-for-publication-client
    - if: '$CI_COMMIT_TAG == null'
      exists:
        - pyproject.client.toml
      needs:
        - job: 'python-uv-build-for-development: [client]'
    - when: never

oci-image-publish:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+/'
      exists:
        - Dockerfile
        - Dockerfile.*
        - images/**/*

helm-chart-publish:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+/'
      exists:
        - etc/helm/**/*

# Overrides for and extensions of SKAO jobs
# *k8s-test jobs (see https://gitlab.com/ska-telescope/sdi/ska-cicd-makefile/-/blob/master/k8s.mk)

# 1) Set base *k8s-test jobs to not run.
k8s-test:
  rules:
  - when: never

stop-k8s-test:
  rules:
  - when: never

# 2) Create templates that extend *k8s-test jobs with some common parameters.
.k8s-test-template:
  extends:
    - k8s-test
  variables:
    CI_KEEP_NAMESPACE: "false"    # delete namespace immediately rather than wait for clean-up (fixes issues with running the pipeline against the same commit hash).
  before_script:
    - echo "$CI_PROJECT_NAME"
    - echo "$CI_COMMIT_SHORT_SHA"
    - make k8s-namespace
    - make k8s-namespace-credentials SERVICE_ACCOUNT=$SERVICE_ACCOUNT
    - make k8s-install-chart
    - kubectl -n $KUBE_NAMESPACE wait --for=condition=ready pod --all --timeout=360s
    - kubectl -n $KUBE_NAMESPACE get all
    - kubectl -n $KUBE_NAMESPACE get services
  rules:
    - when: on_success

.stop-k8s-test-template:
  extends:
    - stop-k8s-test
  rules:
    - when: manual

# 3) Define new *k8s-test jobs that extend off these templates but with specific configuration parameters for
#    enabled and disabled auth environments.
k8s-test-api-with-disabled-auth:
  extends:
    - .k8s-test-template
  variables:
    KUBE_NAMESPACE: "ci-$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA-disabled-auth"
    SERVICE_ACCOUNT: "ci-svc-$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA-disabled-auth"
    ADDMARK: ""
    DISABLE_AUTHENTICATION: "yes"

k8s-test-api-with-enabled-auth:
  extends:
    - .k8s-test-template
  variables:
    KUBE_NAMESPACE: "ci-$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA-enabled-auth"
    SERVICE_ACCOUNT: "ci-svc-$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA-enabled-auth"
    ADDMARK: ""
    DISABLE_AUTHENTICATION: "no"

stop-k8s-test-api-with-disabled-auth:
  extends:
    - .stop-k8s-test-template
  variables:
    KUBE_NAMESPACE: "ci-$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA-disabled-auth"

stop-k8s-test-api-with-enabled-auth:
  extends:
    - .stop-k8s-test-template
  variables:
    KUBE_NAMESPACE: "ci-$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA-enabled-auth"


integration:
  tags:
    - integration-testing
  variables:
    SERVICE_BRANCH: $CI_COMMIT_REF_NAME
    SERVICE_NAME: scapi
    TOOLKIT_IMAGE_NAME: registry.gitlab.com/ska-telescope/src/src-api/ska-src-api-deployment-stack/toolkit
    TOOLKIT_IMAGE_TAG: latest
    RUN_TESTS: "true"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false   # blocking: an MR into main can't merge until this has run and passed
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true    # MRs into other branches: optional
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true

# The finaliser badge job lives in .post and would otherwise wait behind the blocking
# manual integration job. List its real inputs explicitly so it waits for build, lint
# and test (and gets their reports) but not for integration.
create-ci-metrics:
    needs:
        - job: python-uv-lint
          artifacts: true
          optional: true
        - job: python-uv-test
          artifacts: true
          optional: true
        - job: oci-image-lint
          artifacts: true
          optional: true
        - job: python-uv-build-for-development
          artifacts: true
          optional: true
        - job: helm-chart-lint
          artifacts: true
          optional: true
        - job: docs-build
          artifacts: true
          optional: true
        - job: oci-image-build
          artifacts: false
          optional: true
